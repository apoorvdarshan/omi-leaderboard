name: Refresh Cloudflare rankings

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

# One publisher at a time prevents competing writes to the snapshot.
concurrency:
  group: omi-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Restore GitHub data cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache.json
          key: omi-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: omi-data-v1-
      - name: Test
        run: npm test
      - name: Fetch public GitHub data
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish snapshot to Cloudflare
        run: npm run publish:data
        env:
          OMI_PUBLISH_TOKEN: ${{ secrets.OMI_PUBLISH_TOKEN }}
      - name: Save successful data sync
        uses: actions/cache/save@v6
        with:
          path: data/cache.json
          key: omi-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
