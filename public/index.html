<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omi Leaderboard: every merged PR, remembered</title>
<meta name="description" content="Live rankings for everyone building BasedHardware/omi.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/assets/pendant-light.jpg">
<script>document.documentElement.dataset.theme = localStorage.getItem("omi-theme") || "system";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Light/dark tokens via light-dark(); data-theme picks the scheme, "system" follows the OS. */
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root {
    --page: light-dark(#f4f4f6, #000);
    --surface: light-dark(#fff, #0f0f12);
    --ink: light-dark(#000, #fff);
    --on-ink: light-dark(#fff, #000);
    --muted: light-dark(#6e6e76, #9a9aa4);
    --faint: light-dark(#a3a3ab, #5f5f69);
    --line: light-dark(#e7e7ea, #1f1f25);
    --line-2: light-dark(#d4d4da, #33333c);
    --hover: light-dark(#fafafb, #15151a);
    --bar: light-dark(#dcdce1, #2a2a31);
    --led: light-dark(#3d7bff, #5b8fff);
    --led-wash: light-dark(#eef3ff, rgba(91,143,255,.12));
    --up: light-dark(#1a9e5c, #3ccf86);
    --down: light-dark(#d23b4f, #ff6b7f);
    --shadow: light-dark(0 18px 50px -22px rgba(0,0,0,.3), 0 18px 50px -18px rgba(0,0,0,.9));
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 500 14.5px/1.5 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--led); flex: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--led) 18%, transparent), 0 0 12px 2px color-mix(in srgb, var(--led) 55%, transparent); }

  /* Nav: always black, like omi.me */
  nav { background: #000; color: #fff; border-bottom: 1px solid light-dark(transparent, #1a1a1f); position: sticky; top: 0; z-index: 10; }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 12px; }
  .brand { display: flex; align-items: baseline; gap: 11px; text-decoration: none; }
  .brand img { height: 28px; display: block; }
  .brand span { color: rgba(255,255,255,.55); font-weight: 600; font-size: 14px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .synced { color: rgba(255,255,255,.5); font-size: 13px; margin-right: 4px; }
  .theme { display: inline-flex; background: rgba(255,255,255,.09); border-radius: 999px; padding: 3px; }
  .theme button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: rgba(255,255,255,.6); display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s; }
  .theme button:hover { color: #fff; }
  .theme button.on { background: #fff; color: #000; }
  .theme svg { width: 15px; height: 15px; }
  .pill-white { background: #fff; color: #000; border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .pill-white:disabled { opacity: .5; cursor: progress; }

  main { padding: 18px 0 36px; }

  /* Hero: your rank + pendant */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 10px; }
  .you { padding: 18px 18px 14px 20px; display: flex; flex-direction: column; min-height: 286px; }
  .who { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13.5px; }
  .who img { width: 24px; height: 24px; border-radius: 50%; background: var(--page); }
  .who button { background: none; border: 0; padding: 0; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 12.5px; }
  h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.08; font-weight: 800; letter-spacing: -.035em; margin: 12px 0 0; max-width: 520px; }
  h1 .rank { color: var(--led); }
  .detail { color: var(--muted); margin: 8px 0 0; font-size: 14.5px; }
  .detail b { color: var(--ink); font-weight: 700; }
  .move.up { color: var(--up); font-weight: 700; } .move.down { color: var(--down); font-weight: 700; }
  .bar { height: 5px; border-radius: 99px; background: var(--page); overflow: hidden; margin-top: 16px; max-width: 380px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 99px; transition: width 1.1s var(--ease); }
  .actions { display: flex; align-items: center; gap: 18px; margin-top: 18px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 7px; background: var(--ink); color: var(--on-ink); border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity .2s, transform .15s var(--ease); }
  .pill:hover { opacity: .86; } .pill:active { transform: scale(.98); }
  .pill svg { width: 15px; height: 15px; }
  .text-link { background: none; border: 0; padding: 0 0 1px; font-weight: 700; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--line-2); }
  .text-link:hover { border-color: var(--ink); }
  .facts { display: flex; gap: 20px; flex-wrap: wrap; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .facts b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero .actions { margin-bottom: 18px; }

  .photo { position: relative; border-radius: 18px; overflow: hidden; background: #eef0f3; min-height: 240px; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
  .photo .glow { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #5b8fff; box-shadow: 0 0 10px 4px rgba(61,123,255,.7); animation: breathe 2.6s ease-in-out infinite; opacity: 0; }
  @keyframes breathe { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  .photo .tag { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.82); backdrop-filter: blur(10px); color: #000; font-weight: 700; font-size: 12.5px; padding: 6px 11px; border-radius: 999px; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 10px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
  .seg button:hover:not(.on):not(:disabled) { color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--on-ink); }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .s { display: none; }
  .search { position: relative; margin-left: auto; }
  .search input { width: 210px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 34px; outline: none; }
  .search input:focus { border-color: var(--ink); }
  .search input::placeholder { color: var(--faint); }
  .search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 14px; height: 14px; color: var(--faint); }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; padding: 0 4px; }
  .check input { width: 15px; height: 15px; accent-color: var(--ink); margin: 0; }

  /* Top 3 */
  .top3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .t { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; text-decoration: none; min-width: 0; transition: border-color .2s; }
  .t:hover { border-color: var(--line-2); }
  .t .p { font-weight: 800; font-size: 13px; color: var(--faint); width: 26px; }
  .t:first-child .p { color: var(--ink); }
  .t img { width: 42px; height: 42px; border-radius: 50%; background: var(--page); flex: none; }
  .t .meta { min-width: 0; }
  .t .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .t .v { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .t .v b { color: var(--ink); font-size: 17px; font-weight: 800; letter-spacing: -.02em; margin-right: 3px; }

  /* Table */
  .board { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 48px minmax(0,1fr) 150px 100px 60px; gap: 12px; align-items: center; padding: 8px 20px; border-top: 1px solid var(--line); text-decoration: none; transition: background .15s; }
  .row:first-child { border-top: 0; }
  .row.head { color: var(--faint); font-size: 12px; font-weight: 600; padding-top: 11px; padding-bottom: 9px; }
  a.row:hover { background: var(--hover); }
  .rk { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .who { color: var(--ink); font-weight: 700; font-size: 14.5px; gap: 11px; min-width: 0; }
  .row .who img { width: 30px; height: 30px; flex: none; }
  .row .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .who .bot { font-size: 11.5px; font-weight: 600; color: var(--faint); }
  .weeks { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
  .weeks i { flex: 1; background: var(--bar); border-radius: 2px; min-height: 2px; }
  .val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .val small { display: block; font-weight: 500; font-size: 11.5px; color: var(--faint); }
  .chg { text-align: right; font-size: 12.5px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .row.me { background: var(--led-wash); }
  .row.me .rk { color: var(--led); }
  .row.me .weeks i { background: color-mix(in srgb, var(--led) 50%, transparent); }
  .gap { text-align: center; color: var(--faint); border-top: 1px solid var(--line); line-height: 18px; letter-spacing: .25em; }
  .more { display: block; margin: 14px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 9px 20px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .more:hover { border-color: var(--ink); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .foot { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 22px; }
  .foot a { color: var(--muted); }

  .dock { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); translate: -50% 170%; z-index: 20; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 6px 6px 14px; box-shadow: var(--shadow);
    transition: translate .45s var(--ease); white-space: nowrap; font-size: 13px; }
  .dock.show { translate: -50% 0; }
  .dock img { width: 26px; height: 26px; border-radius: 50%; }
  .dock b { font-weight: 800; font-size: 16px; }
  .dock span { color: var(--muted); }
  .dock button { background: var(--ink); color: var(--on-ink); border: 0; border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 12.5px; cursor: pointer; }

  .toast { position: fixed; top: 72px; left: 50%; translate: -50% -40px; z-index: 30; background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 13.5px;
    padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: translate .35s var(--ease), opacity .2s; }
  .toast.show { translate: -50% 0; opacity: 1; }
  .skel { background: linear-gradient(90deg, var(--hover), var(--line), var(--hover)); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 8px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .photo { order: -1; min-height: 0; height: 150px; }
    .you { min-height: 0; padding: 14px 10px 6px; }
    .row { grid-template-columns: 40px minmax(0,1fr) 90px 48px; padding: 8px 14px; }
    .weeks, .h-weeks { display: none; }
    .synced { display: none; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 12px; }
    nav .wrap { height: 54px; }
    .brand img { height: 24px; }
    main { padding-top: 12px; }
    .hero { border-radius: 22px; padding: 8px; }
    .photo { height: 132px; border-radius: 15px; }
    .facts { gap: 14px; font-size: 12.5px; }
    .photo .tag { display: none; }
    .brand span { font-size: 13px; }
    .actions { gap: 14px; }
    .pill { padding: 10px 16px; font-size: 13.5px; }
    .toolbar { gap: 6px; }
    .seg { width: 100%; }
    .seg button { flex: 1; padding: 7px 4px; }
    .l { display: none; } .s { display: inline; }
    .search { margin-left: 0; flex: 1; }
    .search input { width: 100%; }
    .top3 { gap: 6px; }
    .t { flex-direction: column; text-align: center; gap: 6px; padding: 12px 8px; border-radius: 16px; position: relative; }
    .t .p { position: absolute; top: 9px; left: 11px; width: auto; }
    .t img { width: 38px; height: 38px; }
    .t .meta { width: 100%; }
    .t .n { justify-content: center; font-size: 13px; }
    .t .v { font-size: 0; }
    .t .v b { font-size: 16px; margin: 0; }
    .row { grid-template-columns: 30px minmax(0,1fr) 78px 34px; gap: 8px; padding: 8px 12px; }
    .row .who img { width: 28px; height: 28px; }
    .row .who { gap: 9px; font-size: 14px; }
    .board { border-radius: 18px; }
    .dock span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .photo .glow { opacity: .9; } }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="brand" href="https://www.omi.me" target="_blank" rel="noopener"><img src="/assets/omi-logo.png" alt="omi"><span>Leaderboard</span></a>
    <div class="nav-right">
      <span class="synced" id="synced">Syncing</span>
      <div class="theme" id="theme" role="radiogroup" aria-label="Theme">
        <button data-v="system" title="Match system" aria-label="Match system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
        <button data-v="light" title="Light" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
        <button data-v="dark" title="Dark" aria-label="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg></button>
      </div>
      <button class="pill-white" id="refresh">Refresh</button>
    </div>
  </div>
</nav>

<main class="wrap">
  <section class="hero">
    <div class="you" id="you"><div class="skel" style="height:22px;width:160px"></div><div class="skel" style="height:72px;margin-top:14px"></div><div class="skel" style="height:40px;margin-top:14px;width:60%"></div></div>
    <div class="photo" id="photo">
      <img src="/assets/pendant-hero.jpg" alt="The Omi pendant on its cord" id="pendant">
      <span class="glow" id="glow"></span>
      <span class="tag">Every merged PR, remembered.</span>
    </div>
  </section>

  <div class="toolbar">
    <div class="seg" id="metric">
      <button data-v="prs"><span class="l">Merged PRs</span><span class="s">PRs</span></button>
      <button data-v="lines"><span class="l">Lines changed</span><span class="s">Lines</span></button>
      <button data-v="commits">Commits</button>
    </div>
    <div class="seg" id="period">
      <button data-v="all"><span class="l">All time</span><span class="s">All</span></button>
      <button data-v="365"><span class="l">Year</span><span class="s">1y</span></button>
      <button data-v="90"><span class="l">90 days</span><span class="s">90d</span></button>
      <button data-v="30"><span class="l">30 days</span><span class="s">30d</span></button>
      <button data-v="7"><span class="l">7 days</span><span class="s">7d</span></button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Find a contributor" autocomplete="off"></label>
    <label class="check"><input type="checkbox" id="bots" checked>Hide bots</label>
  </div>

  <div class="top3" id="top3"></div>
  <div id="board"></div>
  <p class="foot">Data from the GitHub API, refreshed every 30 minutes. <a href="https://github.com/BasedHardware/omi" target="_blank" rel="noopener">Contribute on GitHub</a></p>
</main>

<div class="dock" id="dock"></div>
<div class="toast" id="toast"></div>

<script>
const DAY = 864e5, WEEK = 7 * DAY, WEEKS = 12, PAGE = 17;
const params = new URLSearchParams(location.search);
const state = {
  metric: params.get("metric") || "prs",
  period: params.get("period") || "all",
  hideBots: params.get("bots") !== "1",
  q: "",
  me: (params.get("me") || localStorage.getItem("omi-me") || "apoorvdarshan").toLowerCase(),
  limit: PAGE,
  data: null,
};
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const compact = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : fmt(n);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const avatar = (u, s = 64) => `https://avatars.githubusercontent.com/${encodeURIComponent(u)}?s=${s}`;
const UNITS = { prs: ["merged PR", "merged PRs"], commits: ["commit", "commits"], lines: ["line changed", "lines changed"] };
const unit = (n) => UNITS[state.metric][n === 1 ? 0 : 1];
const WHEN = { all: "all time", 365: "this past year", 90: "in the last 90 days", 30: "in the last 30 days", 7: "in the last 7 days" };
const when = () => (state.metric === "commits" ? "all time" : WHEN[state.period]);

// Theme: "system" follows the OS via CSS; the choice is remembered.
function bindTheme() {
  const btns = document.querySelectorAll("#theme button");
  const set = (v) => {
    document.documentElement.dataset.theme = v;
    localStorage.setItem("omi-theme", v);
    btns.forEach((b) => { b.classList.toggle("on", b.dataset.v === v); b.setAttribute("aria-checked", b.dataset.v === v); });
  };
  btns.forEach((b) => (b.onclick = () => set(b.dataset.v)));
  set(document.documentElement.dataset.theme);
}

// Put the breathing blue light on the pendant's LED wherever object-fit crops it.
const LED_AT = [0.498, 0.585];
function placeGlow() {
  const img = $("pendant"), glow = $("glow");
  if (!img.naturalWidth) return;
  const W = img.clientWidth, H = img.clientHeight;
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  glow.style.left = (W - dw) * 0.5 + LED_AT[0] * dw + "px";
  glow.style.top = (H - dh) * 0.45 + LED_AT[1] * dh + "px";
  glow.style.opacity = "";
}

function aggregate(from, to, withWeeks) {
  const out = new Map();
  for (const p of state.data.prs) {
    const t = Date.parse(p.m);
    if (t >= to) continue;
    let r = out.get(p.u);
    if (!r) out.set(p.u, (r = { u: p.u, bot: p.bot, prs: 0, lines: 0, weeks: withWeeks ? new Array(WEEKS).fill(0) : null }));
    if (withWeeks) {
      const w = Math.floor((to - t) / WEEK);
      if (w < WEEKS) r.weeks[WEEKS - 1 - w] += state.metric === "lines" ? p.a + p.d : 1;
    }
    if (t < from) continue;
    r.prs++;
    r.lines += p.a + p.d;
  }
  return out;
}

function rank(list) {
  list.sort((a, b) => b.v - a.v || a.u.localeCompare(b.u));
  list.forEach((r, i) => (r.rank = i > 0 && list[i - 1].v === r.v ? list[i - 1].rank : i + 1));
  return list;
}

function build() {
  if (state.metric === "commits") {
    const list = state.data.contributors.filter((c) => !(state.hideBots && c.bot)).map((c) => ({ u: c.u, bot: c.bot, v: c.c }));
    return { list: rank(list), prev: null };
  }
  const now = Date.now();
  const span = state.period === "all" ? Infinity : Number(state.period) * DAY;
  const toList = (m) => rank([...m.values()]
    .filter((r) => !(state.hideBots && r.bot))
    .map((r) => ({ ...r, v: state.metric === "prs" ? r.prs : r.lines }))
    .filter((r) => r.v > 0));
  const list = toList(aggregate(now - span, now, true));
  const prev = new Map(toList(aggregate(now - WEEK - span, now - WEEK, false)).map((r) => [r.u, r.rank]));
  return { list, prev };
}

function move(r, prev) {
  if (!prev) return null;
  const before = prev.get(r.u);
  if (before == null) return { cls: "up", n: null };
  const d = before - r.rank;
  return { cls: d > 0 ? "up" : d < 0 ? "down" : "", n: d };
}

function facts() {
  const d = state.data;
  const people = new Set(d.prs.filter((p) => !p.bot).map((p) => p.u)).size;
  const lines = d.prs.reduce((s, p) => s + p.a + p.d, 0);
  return `<div class="facts"><span><b>${fmt(d.prs.length)}</b> merged PRs</span><span><b>${fmt(people)}</b> contributors</span><span><b>${compact(lines)}</b> lines<span class="l"> changed</span></span></div>`;
}

function renderYou(list, prev) {
  const idx = list.findIndex((r) => r.u.toLowerCase() === state.me);
  const me = list[idx];
  if (!me) {
    $("you").innerHTML = `
      <div class="who"><img src="${avatar(state.me, 48)}" alt="">${esc(state.me)}</div>
      <h1>No ${UNITS[state.metric][1]} ${when()} yet.</h1>
      <p class="detail">Pick a longer time range, or check the GitHub username.</p>
      <div class="actions"><button class="pill" id="setme">Change username</button></div>${facts()}`;
    $("setme").onclick = setMe;
    return null;
  }
  const ahead = list.slice(0, idx).reverse().find((r) => r.v > me.v);
  const need = ahead ? ahead.v - me.v + 1 : 0;
  const pct = ahead ? Math.max(4, Math.min(100, (me.v / (ahead.v + 1)) * 100)) : 100;
  const top = Math.max(1, Math.ceil((me.rank / list.length) * 100));
  const m = move(me, prev);
  const moved = m && m.n ? ` <span class="move ${m.cls}">${m.n > 0 ? "Up" : "Down"} ${Math.abs(m.n)} this week.</span>` : "";
  $("you").innerHTML = `
    <div class="who"><span class="led"></span><img src="${avatar(me.u, 48)}" alt="">${esc(me.u)}<button id="setme">Not you?</button></div>
    <h1>You're <span class="rank">#${me.rank}</span> of ${fmt(list.length)} Omi contributors.</h1>
    <p class="detail"><b>${fmt(me.v)} ${unit(me.v)}</b> ${when()}, top ${top}%.${moved}
      ${ahead ? `<br>${fmt(need)} more to pass <b>${esc(ahead.u)}</b> at #${ahead.rank}.` : "<br>Nobody is ahead of you."}</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="actions">
      <button class="pill" id="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>Share card</button>
      <button class="text-link" id="copy">Copy brag</button>
      <button class="text-link" id="link">Copy link</button>
    </div>${facts()}`;
  requestAnimationFrame(() => requestAnimationFrame(() => ($("fill").style.width = pct + "%")));
  $("setme").onclick = setMe;
  $("copy").onclick = () => copy(`I'm #${me.rank} of ${fmt(list.length)} contributors to Omi (github.com/BasedHardware/omi) with ${fmt(me.v)} ${unit(me.v)} ${when()}.`);
  $("link").onclick = () => copy(shareUrl());
  $("card").onclick = () => downloadCard(me, list.length, top);
  return me;
}

function renderTop3(list, me) {
  const place = ["1st", "2nd", "3rd"];
  $("top3").innerHTML = list.slice(0, 3).map((r, i) => `
    <a class="t" href="https://github.com/${esc(r.u)}" target="_blank" rel="noopener">
      <span class="p">${place[i]}</span>
      <img src="${avatar(r.u, 96)}" alt="">
      <span class="meta"><span class="n">${r === me ? '<span class="led"></span>' : ""}${esc(r.u)}</span><span class="v"><b>${fmt(r.v)}</b>${unit(r.v)}</span></span>
    </a>`).join("");
}

function bars(weeks) {
  const max = Math.max(1, ...weeks);
  return weeks.map((w) => `<i style="height:${w ? Math.max(12, (w / max) * 100) : 8}%;${w ? "" : "opacity:.5"}"></i>`).join("");
}

function row(r, prev, me) {
  const m = move(r, prev);
  const chg = !m ? "" : m.n === null ? "New" : m.n > 0 ? `+${m.n}` : m.n < 0 ? `−${-m.n}` : "–";
  const sub = state.metric === "prs" ? `${compact(r.lines)} lines` : state.metric === "lines" ? `${fmt(r.prs)} PRs` : "";
  return `
    <a class="row ${r === me ? "me" : ""}" ${r === me ? 'id="my-row"' : ""} href="https://github.com/BasedHardware/omi/pulls?q=is%3Apr+is%3Amerged+author%3A${encodeURIComponent(r.u)}" target="_blank" rel="noopener">
      <span class="rk">${r.rank}</span>
      <span class="who">${r === me ? '<span class="led"></span>' : ""}<img src="${avatar(r.u, 60)}" alt="" loading="lazy"><span class="nm">${esc(r.u)}</span>${r.bot ? '<span class="bot">bot</span>' : ""}</span>
      <span class="weeks">${r.weeks ? bars(r.weeks) : ""}</span>
      <span class="val">${state.metric === "lines" ? compact(r.v) : fmt(r.v)}${sub ? `<small>${sub}</small>` : ""}</span>
      <span class="chg ${m ? m.cls : ""}">${chg}</span>
    </a>`;
}

function renderBoard(list, prev, me) {
  const q = state.q.trim().toLowerCase();
  const pool = q ? list.filter((r) => r.u.toLowerCase().includes(q)) : list.slice(3);
  const shown = pool.slice(0, state.limit);
  const pinMe = me && !q && list.indexOf(me) >= 3 && !shown.includes(me);
  const label = UNITS[state.metric][1];
  const head = `<div class="row head"><span>Rank</span><span>Contributor</span><span class="h-weeks">${state.metric === "commits" ? "" : `Last ${WEEKS} weeks`}</span><span style="text-align:right">${label[0].toUpperCase() + label.slice(1).replace(" changed", "")}</span><span style="text-align:right">${prev ? "7d" : ""}</span></div>`;
  if (!shown.length && !pinMe) {
    $("board").innerHTML = `<div class="board"><div class="empty">${q ? `Nobody matches “${esc(state.q)}”. Try part of a GitHub username.` : "Only the top three have activity in this range."}</div></div>`;
    return;
  }
  $("board").innerHTML = `
    <div class="board">${head}${shown.map((r) => row(r, prev, me)).join("")}${pinMe ? `<div class="gap">···</div>${row(me, prev, me)}` : ""}</div>
    ${pool.length > state.limit ? `<button class="more" id="more">Show more (${fmt(pool.length - state.limit)} left)</button>` : ""}`;
  if ($("more")) $("more").onclick = () => { state.limit += 50; render(); };
}

function renderDock(me, total) {
  if (!me) { $("dock").innerHTML = ""; $("dock").classList.remove("show"); return; }
  $("dock").innerHTML = `<span class="led"></span><img src="${avatar(me.u, 52)}" alt=""><b>#${me.rank}</b><span>of ${fmt(total)}, ${fmt(me.v)} ${unit(me.v)}</span><button id="dock-top">My rank</button>`;
  $("dock-top").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
}

// The pill appears only after you scroll past your hero rank, and hides while your row is on screen.
let observer;
function watchDock() {
  observer?.disconnect();
  if (!$("dock").innerHTML) return;
  let pastYou = false, rowVisible = false;
  observer = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.target.id === "you") pastYou = !e.isIntersecting && e.boundingClientRect.top < 0;
      else rowVisible = e.isIntersecting;
    }
    $("dock").classList.toggle("show", pastYou && !rowVisible);
  });
  [$("you"), $("my-row")].filter(Boolean).forEach((t) => observer.observe(t));
}

function render() {
  const { list, prev } = build();
  document.querySelectorAll("#period button").forEach((b) => (b.disabled = state.metric === "commits"));
  const me = renderYou(list, prev);
  renderTop3(list, me);
  renderBoard(list, prev, me);
  renderDock(me, list.length);
  watchDock();
  history.replaceState(null, "", shareUrl());
}

function shareUrl() {
  const u = new URL(location.href);
  const p = new URLSearchParams({ metric: state.metric, period: state.period, me: state.me });
  if (!state.hideBots) p.set("bots", "1");
  u.search = p.toString();
  return u.toString();
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); } catch { prompt("Copy this:", text); }
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1800);
}
function setMe() {
  const v = prompt("Your GitHub username", state.me);
  if (!v) return;
  state.me = v.trim().replace(/^@/, "").toLowerCase();
  localStorage.setItem("omi-me", state.me);
  state.limit = PAGE;
  render();
}

const loadImg = (src) => new Promise((ok, fail) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => ok(i); i.onerror = fail; i.src = src; });

// 1200×630 share card in the omi.me look.
async function downloadCard(me, total, top) {
  await document.fonts.load("800 40px Manrope");
  const W = 1200, H = 630, c = document.createElement("canvas");
  c.width = W * 2; c.height = H * 2;
  const g = c.getContext("2d");
  g.scale(2, 2);
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  const F = (w, s) => `${w} ${s}px Manrope, -apple-system, system-ui, sans-serif`;
  try {
    const p = await loadImg("/assets/pendant-hero.jpg");
    const x = 640, w = 560, sh = p.height, sw = (w / H) * sh;
    g.drawImage(p, (p.width - sw) / 2, 0, sw, sh, x, 0, w, H);
    const fade = g.createLinearGradient(x, 0, x + 120, 0);
    fade.addColorStop(0, "#fff"); fade.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = fade; g.fillRect(x, 0, 120, H);
  } catch {}
  g.fillStyle = "#000"; g.fillRect(0, 0, 640, 84);
  try { const logo = await loadImg("/assets/omi-logo.png"); g.drawImage(logo, 64, 24, 82, 36); } catch {}
  g.fillStyle = "rgba(255,255,255,.6)"; g.font = F(600, 20); g.fillText("Leaderboard", 162, 56);
  try {
    const a = await loadImg(avatar(me.u, 112));
    g.save(); g.beginPath(); g.arc(92, 166, 28, 0, Math.PI * 2); g.clip(); g.drawImage(a, 64, 138, 56, 56); g.restore();
  } catch {}
  g.fillStyle = "#3d7bff"; g.beginPath(); g.arc(136, 166, 6, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#000"; g.font = F(700, 26); g.fillText(me.u, 152, 175);
  g.font = F(800, 168); g.fillStyle = "#000";
  g.fillText("#", 58, 372);
  const hw = g.measureText("#").width;
  g.fillStyle = "#3d7bff"; g.fillText(String(me.rank), 58 + hw, 372);
  g.fillStyle = "#000"; g.font = F(800, 34);
  g.fillText(`of ${fmt(total)} Omi contributors`, 64, 430);
  g.fillStyle = "#6e6e76"; g.font = F(500, 24);
  g.fillText(`${fmt(me.v)} ${unit(me.v)} ${when()}, top ${top}%`, 64, 474);
  g.fillText("github.com/BasedHardware/omi", 64, 566);
  const a = document.createElement("a");
  a.download = `omi-rank-${me.u}.png`;
  a.href = c.toDataURL("image/png");
  a.click();
  toast("Share card downloaded");
}

function bindSeg(id, key) {
  const btns = document.querySelectorAll(`#${id} button`);
  btns.forEach((b) => {
    b.classList.toggle("on", b.dataset.v === state[key]);
    b.onclick = () => {
      state[key] = b.dataset.v;
      state.limit = PAGE;
      btns.forEach((x) => x.classList.toggle("on", x === b));
      render();
    };
  });
}

function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  return s < 60 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : new Date(iso).toLocaleDateString();
}

async function load() {
  const res = await fetch("/api/data");
  if (!res.ok) throw new Error(await res.text());
  state.data = await res.json();
  $("synced").textContent = `Updated ${ago(state.data.syncedAt)}`;
  render();
}

bindTheme();
bindSeg("metric", "metric");
bindSeg("period", "period");
$("bots").checked = state.hideBots;
$("bots").onchange = (e) => { state.hideBots = e.target.checked; render(); };
$("q").oninput = (e) => { state.q = e.target.value; state.limit = PAGE; render(); };
$("pendant").complete ? placeGlow() : ($("pendant").onload = placeGlow);
new ResizeObserver(placeGlow).observe($("photo"));
$("refresh").onclick = async () => {
  const b = $("refresh");
  b.disabled = true; b.textContent = "Refreshing";
  try { await fetch("/api/refresh", { method: "POST" }); await load(); toast("Up to date"); }
  finally { b.disabled = false; b.textContent = "Refresh"; }
};
$("board").innerHTML = `<div class="board">${'<div class="row"><div class="skel" style="height:20px;grid-column:1/-1"></div></div>'.repeat(8)}</div>`;
load().catch((err) => ($("board").innerHTML = `<div class="board"><div class="empty">Couldn't load rankings: ${esc(err.message)}. Check that the server is running, then refresh.</div></div>`));
</script>
</body>
</html>
